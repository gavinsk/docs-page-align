<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Docs Page Align</title>
  <style>
    :root { color-scheme: light dark; --fg: #1f1f1f; --muted: #5f6368; --bg: #fff; --line: #dadce0; --accent: #0b57d0; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e3e3e3; --muted: #9aa0a6; --bg: #202124; --line: #3c4043; --accent: #a8c7fa; }
    }
    body { margin: 0; padding: 14px 16px; width: 240px; font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    h1 { font-size: 14px; margin: 0 0 12px; }
    .label { color: var(--muted); margin: 0 0 6px; }
    .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
    .seg label { flex: 1; text-align: center; padding: 6px 0; cursor: pointer; }
    .seg label + label { border-left: 1px solid var(--line); }
    .seg input { display: none; }
    .seg input:checked + span { color: var(--accent); font-weight: 600; }
    .row { display: flex; gap: 8px; align-items: center; }
    input[type=range] { flex: 1; accent-color: var(--accent); }
    input[type=number] { width: 56px; }
    .seg.disabled { opacity: .4; pointer-events: none; }
    #alignNote:empty { display: none; }
    .note { color: var(--muted); font-size: 11px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Docs Page Align</h1>

  <p class="label">Page position (this Doc only)</p>
  <div class="seg" id="align">
    <label><input type="radio" name="align" value="left"><span>Left</span></label>
    <label><input type="radio" name="align" value="center"><span>Center</span></label>
    <label><input type="radio" name="align" value="right"><span>Right</span></label>
  </div>
  <p class="note" id="alignNote"></p>

  <p class="label">Gap from screen edge (px)</p>
  <div class="row">
    <input type="range" id="gapRange" min="0" max="400" step="4">
    <input type="number" id="gapNum" min="0" max="2000" step="1">
  </div>

  <p class="note">New Docs open centered. Applies only in Pages layout. The gap applies to all Docs.</p>

  <script src="popup.js"></script>
</body>
</html>
